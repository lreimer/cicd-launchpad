plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

configurations {
    picocliCodegen
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('dom4j:dom4j') using module('org.dom4j:dom4j:2.2.0')
    }
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'org.apache.commons:commons-collections4:4.6.0'
    implementation 'com.offbytwo.jenkins:jenkins-client:0.3.8'
    implementation 'jakarta.json:jakarta.json-api:2.1.3'

    // The Jenkins client has no newer release; keep its transitives on compatible release lines.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.3')
    constraints {
        implementation 'com.google.guava:guava:33.7.2-jre'
        implementation 'org.apache.httpcomponents:httpclient:4.5.14'
        implementation 'org.apache.httpcomponents:httpcore:4.4.16'
        implementation 'org.apache.httpcomponents:httpmime:4.5.14'
        implementation 'commons-io:commons-io:2.22.0'
        implementation 'commons-beanutils:commons-beanutils:1.11.0'
        implementation 'commons-codec:commons-codec:1.22.1'
        implementation 'commons-logging:commons-logging:1.4.0'
        implementation 'jaxen:jaxen:2.0.6'
    }

    runtimeOnly 'org.eclipse.parsson:parsson:1.1.9'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'
    runtimeOnly 'org.fusesource.jansi:jansi:2.4.3'
    runtimeOnly 'oro:oro:2.0.8'

    picocliCodegen 'info.picocli:picocli-codegen:4.7.7'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.ops.tools.CiCdLaunchpad'
}

tasks.named('run', JavaExec) {
    if (providers.gradleProperty('nativeImageAgent').isPresent()) {
        jvmArgs '-agentlib:native-image-agent=config-merge-dir=build/resources/main/META-INF/native-image'
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('copyRuntimeLibs', Sync) {
    into layout.buildDirectory.dir('runtime-libs')
    from sourceSets.main.runtimeClasspath
    include "*.jar"
}

tasks.named('assemble') {
    finalizedBy 'copyRuntimeLibs'
}

tasks.register('reflectionConfigGenerator', JavaExec) {
    description = 'Generate reflection config'
    dependsOn 'classes'
    mainClass = 'picocli.codegen.aot.graalvm.ReflectionConfigGenerator'
    classpath = sourceSets.main.runtimeClasspath + configurations.picocliCodegen
    args = ['dev.ops.tools.CiCdLaunchpad', '--output', 'build/reflect.json']
}


import groovy.json.JsonBuilder
import groovy.json.JsonSlurper

tasks.register('extendReflectJson') {
    dependsOn 'reflectionConfigGenerator'
    doLast {
        def reflectJson = file("$buildDir/reflect.json")
        def json = new JsonSlurper().parseText(reflectJson.text)

        json << getReflectInfo("java.util.ArrayList")
        json << getReflectInfo("java.util.HashMap")

        def extendedReflectJson = file("$buildDir/extended-reflect.json")
        extendedReflectJson.write(new JsonBuilder(json).toPrettyString())
    }
}

def getReflectInfo(String name) {
    def info = [
            name                   : name,
            allDeclaredConstructors: true,
            allPublicConstructors  : true,
            allDeclaredMethods     : true,
            allPublicMethods       : true,
            fields                  : getFields(name)
    ]
    info
}

def getFields(String name) {
    def fields = []

    Class clazz = Class.forName(name)
    def declaredFields = clazz.getDeclaredFields()
    declaredFields.each {
        fields << [name: it.name]
    }

    fields
}

tasks.named('reflectionConfigGenerator') {
    finalizedBy 'extendReflectJson'
}

tasks.register('graalNativeImage', Exec) {
    description = 'Generate native image with GraalVM 21'
    dependsOn 'extendReflectJson'
    workingDir "$buildDir"
    doFirst {
        commandLine = [
            'native-image',
            '-cp', sourceSets.main.runtimeClasspath.asPath,
            '-H:ReflectionConfigurationFiles=extended-reflect.json',
            '-H:+ReportExceptionStackTraces',
            '-H:+AddAllCharsets',
            '--initialize-at-run-time=com.sun.media.sound',
            '--enable-http',
            '--enable-https',
            '--no-fallback',
            'dev.ops.tools.CiCdLaunchpad',
            'cicd-launchpad'
        ]
    }
}

tasks.register('copyJsound', Copy) {
    from javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath.dir('lib') }
    into "$buildDir"
    include "**/libjsound.*"
}
